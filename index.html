<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1d2025">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Calc Natural">
<meta name="description" content="Calculadora científica con pantalla natural: cálculo, complejos, Base-N, matrices, vectores, estadística, distribuciones, ecuaciones, inecuaciones, tablas y proporciones.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Calc Natural · Científica</title>
<style>
*{box-sizing:border-box}
:root{
  --amber:#f59e0b; --cyan:#06b6d4;
  --lcd:#c4cebb; --lcd-hi:#d0d9c7; --ink:#14201a; --ink2:#55645a;
  --math:"STIX Two Math","STIX Two Text","Cambria Math","Latin Modern Math","Times New Roman",Times,serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Roboto Mono",monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
}
body.lcd-dark{--lcd:#0a120f; --lcd-hi:#0f1a16; --ink:#f3b54a; --ink2:#7f8b80}
html,body{margin:0;height:100%;overflow:hidden;background:#0d0f12}
body{position:fixed;inset:0;display:flex;justify-content:center;align-items:center;font-family:var(--sans);color:#ece9e3;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;touch-action:manipulation;-webkit-text-size-adjust:100%}
.calc{width:100%;height:100dvh;max-width:470px;display:flex;flex-direction:column;gap:7px;
  padding:calc(env(safe-area-inset-top) + 8px) calc(env(safe-area-inset-right) + 10px) calc(env(safe-area-inset-bottom) + 10px) calc(env(safe-area-inset-left) + 10px);
  background:linear-gradient(175deg,#2b2f36 0%,#1e2126 16%,#1a1c20 100%)}
@media (min-width:600px) and (min-height:700px){
  .calc{height:min(calc(100dvh - 40px),930px);border-radius:32px;box-shadow:0 40px 90px #000c,inset 0 1px 0 #ffffff1c,inset 0 -2px 0 #0009}
}
/* ---------- Pantalla ---------- */
.bezel{flex:0 0 auto;background:#0f1114;border-radius:16px;padding:9px;box-shadow:inset 0 2px 4px #000,0 1px 0 #ffffff14}
.lcd{position:relative;height:clamp(176px,31dvh,280px);background:linear-gradient(180deg,var(--lcd-hi),var(--lcd));color:var(--ink);
  border-radius:8px;overflow:hidden;display:flex;flex-direction:column;box-shadow:inset 0 2px 7px #0007,inset 0 0 0 1px #0005}
.lcd::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(155deg,#ffffff24 0%,#ffffff08 30%,transparent 46%)}
body.lcd-dark .lcd::after{background:linear-gradient(155deg,#ffffff0e 0%,transparent 40%)}
.status{flex:0 0 auto;height:19px;display:flex;align-items:center;gap:7px;padding:4px 9px 0;font:600 11px/1 var(--mono);color:var(--ink2)}
.status .on{background:var(--ink);color:var(--lcd);padding:2px 4px;border-radius:2px}
.status .app{margin-left:auto;font-family:var(--sans);font-weight:600}
.view{position:relative;flex:1;min-height:0;padding:3px 10px 7px}
.plate{display:flex;justify-content:space-between;align-items:baseline;padding:0 8px;font:600 11px/1 var(--sans);color:#8d929b}
.plate b{font:italic 700 13px/1 var(--math);color:#c9ccd2;letter-spacing:.02em}
/* ---------- Escritura natural ---------- */
.m{font-family:var(--math)}
.input{position:absolute;left:10px;right:10px;top:4px;height:56%;display:flex;align-items:center;font-size:23px;line-height:1.15;white-space:nowrap;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
.input::-webkit-scrollbar,.result::-webkit-scrollbar{display:none}
.input>.wrap{display:inline-flex;align-items:center;padding-right:6px}
.result{position:absolute;left:10px;right:10px;bottom:7px;max-height:48%;display:flex;justify-content:flex-end;align-items:flex-end;font-size:27px;white-space:nowrap;overflow:auto;scrollbar-width:none}
.result .rv{display:inline-flex;flex-direction:column;align-items:flex-end;margin-left:auto}
.result .pr{display:inline-flex;align-items:center;gap:4px;font-size:.8em}
.tk{display:inline-flex;align-items:center}
.tk.op{padding:0 .08em}
.tk small{font-size:.75em}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 .08em;font-size:.86em}
.frac>span{display:inline-flex;align-items:center;justify-content:center;padding:0 .12em;line-height:1.12}
.frac>span:first-child{border-bottom:.075em solid currentColor;padding-bottom:.05em}
.frac>span:last-child{padding-top:.05em}
.sqrt{display:inline-flex;align-items:stretch}
.sqrt .rs{position:relative;flex:0 0 auto;width:.55em;margin-right:-1px}
.sqrt .rs svg{position:absolute;inset:0;width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linejoin:round;vector-effect:non-scaling-stroke;overflow:visible}
.sqrt .rr{display:inline-flex;align-items:center;border-top:1.5px solid currentColor;padding:.08em .12em 0 .08em}
.sqrt .ri{font-size:.55em;align-self:flex-start;margin-right:-.42em;margin-top:.05em;position:relative;z-index:1}
.key .sqrt{font:500 17px/1 var(--math)}
.sup{display:inline-flex;align-items:center;font-size:.62em;align-self:flex-start;margin-top:-.25em}
.sub{display:inline-flex;align-items:center;font-size:.62em;align-self:flex-end;margin-bottom:-.2em}
.abs{display:inline-flex;align-items:center;border-left:.07em solid currentColor;border-right:.07em solid currentColor;padding:0 .12em;margin:0 .06em}
.bigop{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1;margin-right:.1em;gap:.12em}
.bigop .lim{font-size:.55em;display:inline-flex;align-items:center}
.bigop .sym{font-size:1.25em;line-height:1}
.dx{font-style:italic;margin-left:.15em}
.x10{font-size:.9em}
.ph{display:inline-block;position:relative;width:.6em;height:.82em;border:.06em dashed currentColor;margin:0 .06em;opacity:.75;flex:0 0 auto}
.cur{display:inline-block;width:2px;height:1.05em;background:currentColor;margin:0 -1px;animation:blink 1.05s steps(1) infinite;flex:0 0 auto}
.ph .cur{position:absolute;left:1px;top:.04em;height:.68em}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.cur{animation:none}}
.mat{display:inline-flex;align-items:center;gap:0;border-left:.08em solid currentColor;border-right:.08em solid currentColor;border-radius:.25em;padding:.05em .1em;font-size:.6em}
.mat table{border-collapse:collapse}
.mat td{padding:.05em .4em;text-align:right;white-space:nowrap}
/* ---------- Menús y formularios ---------- */
.ttl{font:700 12.5px/1.2 var(--sans);padding:2px 2px 5px;display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid color-mix(in srgb,var(--ink) 30%,transparent)}
.ttl i{font-style:normal;font-weight:500;opacity:.75}
.scroll{position:absolute;left:10px;right:10px;top:27px;bottom:22px;overflow:auto;scrollbar-width:thin}
.scroll.full{bottom:6px}
.row{display:flex;align-items:center;gap:8px;padding:4px 5px;font:500 14px/1.25 var(--sans);border-radius:3px;cursor:pointer}
.row .n{width:13px;font:600 11px/1 var(--mono);opacity:.6;flex:0 0 auto}
.row .lb{flex:1;min-width:0}
.row .vl{font:500 12px/1.2 var(--mono);opacity:.85;text-align:right}
.row .ch{opacity:.6}
.row.sel{background:var(--ink);color:var(--lcd)}
.row .rbtn{font:600 11px/1 var(--sans);border:1px solid currentColor;border-radius:4px;padding:3px 5px;background:none;color:inherit}
.home{display:grid;grid-template-columns:repeat(4,1fr);gap:3px}
.app{background:none;border:0;color:inherit;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 1px 5px;font:600 10.5px/1.1 var(--sans);border-radius:6px;cursor:pointer}
.app .ic{display:flex!important;align-items:center;justify-content:center;font:600 14px/1 var(--math);min-width:36px;padding:0 4px;white-space:nowrap;height:25px;display:grid;place-items:center;border:1.5px solid currentColor;border-radius:6px}
.app.sel{background:var(--ink);color:var(--lcd)}
.hint{position:absolute;left:10px;right:10px;bottom:4px;font:500 10.5px/1.2 var(--sans);color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fl .row{font-size:14px}
.fl .row .vl{font:500 15px/1.2 var(--math);display:inline-flex;align-items:center;justify-content:flex-end;gap:1px;min-height:20px}
.grid{border-collapse:collapse;font:500 14px/1.2 var(--mono)}
.grid th{font:600 11px/1 var(--sans);color:var(--ink2);padding:2px 4px;text-align:center}
.grid th.rh{text-align:right;padding-right:6px}
.grid td{border:1px solid color-mix(in srgb,var(--ink) 30%,transparent);padding:3px 6px;min-width:58px;height:24px;text-align:right;white-space:nowrap;cursor:pointer}
.grid td.sel{background:var(--ink);color:var(--lcd)}
.grid td .cur{height:.95em}
.res .row{cursor:default}
.res .row .vl{font:500 16px/1.2 var(--math);display:inline-flex;align-items:center;gap:2px}
.tbl{border-collapse:collapse;font:500 13px/1.2 var(--mono);width:100%}
.tbl th{font:600 11px var(--sans);color:var(--ink2);text-align:right;padding:2px 6px;border-bottom:1px solid color-mix(in srgb,var(--ink) 30%,transparent)}
.tbl td{text-align:right;padding:3px 6px;white-space:nowrap}
.tbl tr.sel td{background:var(--ink);color:var(--lcd)}
.base .bin{font:500 13px/1.35 var(--mono);letter-spacing:.02em}
.base .others{position:absolute;left:10px;right:10px;bottom:6px;font:500 11.5px/1.35 var(--mono);color:var(--ink2)}
.base .others b{display:inline-block;width:32px;color:var(--ink)}
.base .big{position:absolute;right:10px;left:10px;top:58px;text-align:right;font:500 26px/1.15 var(--mono);white-space:nowrap;overflow-x:auto}
.base .bexpr{position:absolute;left:10px;right:10px;top:6px;font:500 20px/1.2 var(--mono);white-space:nowrap;overflow-x:auto;display:flex;align-items:center}
.err{position:absolute;inset:12px 16px;background:var(--lcd);border:2px solid var(--ink);border-radius:6px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:7px;text-align:center;padding:10px;z-index:3}
.err b{font:700 17px/1.2 var(--sans)}
.err span{font:500 12px/1.3 var(--sans);color:var(--ink2)}
/* ---------- Teclado ---------- */
.ctrl{flex:0 0 auto;display:grid;grid-template-columns:1fr 1fr 1.55fr 1fr 1fr;grid-template-rows:1fr 1fr;gap:7px 8px;height:clamp(80px,12.6dvh,110px);padding:0 2px}
.cbtn{border:0;border-radius:14px;background:linear-gradient(180deg,#3a3f48,#2a2e35);color:#d9d6cf;font:600 12px/1 var(--sans);
  box-shadow:0 2px 0 #0b0c0e,0 3px 7px #0007,inset 0 1px 0 #ffffff1c;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0;position:relative}
.cbtn .s2{font:600 9px/1 var(--sans);color:var(--amber)}
.cbtn.shift{color:var(--amber)} .cbtn.alpha{color:var(--cyan)}
body.sh .cbtn.shift{background:var(--amber);color:#1c1405}
body.al .cbtn.alpha{background:var(--cyan);color:#04191d}
.dpad{grid-column:3;grid-row:1/span 2;justify-self:center;height:100%;aspect-ratio:1;position:relative;border-radius:50%;
  background:radial-gradient(circle at 50% 30%,#3d434c,#24282e 72%);box-shadow:0 3px 0 #0b0c0e,0 5px 12px #0008,inset 0 1px 0 #ffffff1c}
.dpad button{position:absolute;border:0;background:transparent;color:#d6d3cc;font:600 12px/1 var(--sans);display:grid;place-items:center;border-radius:40%}
.dpad .up{top:2%;left:32%;width:36%;height:30%}
.dpad .dn{bottom:2%;left:32%;width:36%;height:30%}
.dpad .lf{left:2%;top:32%;width:30%;height:36%}
.dpad .rt{right:2%;top:32%;width:30%;height:36%}
.dpad .ok{left:33%;top:33%;width:34%;height:34%;border-radius:50%;background:linear-gradient(#4a515b,#2d3239);box-shadow:inset 0 1px 0 #ffffff26,0 1px 3px #000a;font-weight:700}
.dpad button.down{background:#ffffff14}
.dpad .ok.down{background:#565e69}
.keys{display:grid;min-height:0}
.fn{flex:3;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(3,1fr);gap:3px 7px}
.num{flex:4.5;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(4,1fr);gap:4px 9px;margin-top:2px}
.k{display:flex;flex-direction:column;min-height:0;min-width:0}
.lg{flex:0 0 13px;display:flex;justify-content:space-between;align-items:flex-end;font:600 9.5px/1 var(--sans);padding:0 1px 2px;white-space:nowrap;overflow:hidden;gap:2px}
.lg .s{color:var(--amber)} .lg .a{color:var(--cyan)}
.lg sup{font-size:.75em;line-height:0}
body.sh .lg .s,body.al .lg .a{color:#14100a;border-radius:3px;padding:1px 2px}
body.sh .lg .s{background:var(--amber)} body.al .lg .a{background:var(--cyan)}
body.base-mode .fn .lg span,body.base-mode .num .lg span{visibility:hidden}
.key{flex:1;min-height:0;width:100%;border:0;border-radius:8px 8px 11px 11px;padding:0;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(180deg,#3b4049,#2d3138);color:#ece9e3;font:500 15px/1 var(--sans);
  box-shadow:0 2px 0 #0a0b0d,0 3px 6px #0007,inset 0 1px 0 #ffffff1c;transition:transform .04s}
.key .ms{font-family:var(--math);font-size:17px}
.key i{font-family:var(--math);font-size:19px}
.key sup{font-size:.62em;line-height:0;position:relative;top:-.15em}
.key sub{font-size:.62em;line-height:0}
.num .key{background:linear-gradient(180deg,#ebe8e1,#d3cfc6);color:#17191c;font:600 22px/1 var(--sans);box-shadow:0 2px 0 #77736b,0 3px 6px #0008,inset 0 1px 0 #fff9}
.num .key.wd{font-size:14px;letter-spacing:.02em}
.num .key.del,.num .key.ac{background:linear-gradient(180deg,#f8b443,#e0920f);color:#1f1506;box-shadow:0 2px 0 #7b4f07,0 3px 6px #0008,inset 0 1px 0 #ffe2a8}
.key.down,.cbtn.down{transform:translateY(2px);box-shadow:0 0 0 #000,inset 0 1px 0 #ffffff12;filter:brightness(1.12)}
.key:focus-visible,.cbtn:focus-visible,.dpad button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 22px);transform:translate(-50%,20px);opacity:0;background:#0f1114;color:#f3f1ec;border:1px solid #3a3f48;
  padding:9px 14px;border-radius:10px;font:500 13px/1.3 var(--sans);transition:opacity .2s,transform .2s;pointer-events:none;z-index:9;max-width:86vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-height:640px){.lcd{height:clamp(150px,28dvh,200px)}.input{font-size:20px}.result{font-size:23px}.lg{flex-basis:11px;font-size:8.5px}.num .key{font-size:19px}}
</style>
</head>
<body>
<main class="calc" aria-label="Calculadora científica">
  <div class="bezel"><section class="lcd" id="lcd"><div class="status" id="status"></div><div class="view" id="view" aria-live="polite"></div></section></div>
  <div class="plate"><span>Científica natural</span><b>N·570</b></div>
  <section class="ctrl" id="ctrl"></section>
  <section class="keys fn" id="fn"></section>
  <section class="keys num" id="num"></section>
</main>
<div class="toast" id="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/mathjs@12.4.2/lib/browser/math.js"></script>
<script>
'use strict';
/* ================= Utilidades ================= */
const $ = s => document.querySelector(s);
class CalcError extends Error { constructor(m) { super(m); this.calc = true; } }
const ERR = { math: 'Error matemático', syntax: 'Error de sintaxis', arg: 'Error de argumento', dim: 'Error de dimensión',
  time: 'Error de tiempo', undef: 'Variable no definida', range: 'Fuera de rango', data: 'Faltan datos' };
const fail = k => { throw new CalcError(ERR[k] || k); };
const isNum = v => typeof v === 'number';
const isCx = v => !!(v && v.isComplex);
const isMat = v => !!(v && v.isMatrix);
const clone = o => JSON.parse(JSON.stringify(o));
const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a; };
const ndig = n => String(Math.abs(n)).replace('.', '').length;
const MINUS = '−';
const neg = s => String(s).replace(/-/g, MINUS);

/* ================= Persistencia (IndexedDB, patrón repositorio) ================= */
const Repo = (() => {
  let p;
  const db = () => p || (p = new Promise((res, rej) => {
    const r = indexedDB.open('calc-cw', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
  return {
    async get(k) { try { const d = await db(); return await new Promise((res, rej) => { const q = d.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); } catch (e) { return undefined; } },
    async set(k, v) { try { const d = await db(); await new Promise((res, rej) => { const t = d.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = res; t.onerror = () => rej(t.error); }); } catch (e) { } }
  };
})();

/* ================= Estado ================= */
const DEF_SET = { angle: 'D', fmt: 'norm1', fix: 2, sci: 10, res: 'exact', cplx: 'rect', lcd: 'classic', haptic: true };
const VARS = ['A', 'B', 'C', 'D', 'E', 'F', 'x', 'y', 'z', 'M'];
const S = {
  app: 'calc', shift: false, alpha: false, set: { ...DEF_SET },
  vars: Object.fromEntries(VARS.map(v => [v, 0])), ans: 0, preAns: 0,
  mats: {}, vcts: {}, matAns: null, vctAns: null,
  expr: [], cur: { path: [], i: 0 }, done: false, res: null, err: null, hist: [], hi: 0,
  stack: [], form: null, view: null,
  st: { type: '1v', data: [] }, eq: {}, tb: { f: [], g: [], a: 1, b: 5, s: 1 },
  base: { b: 10, toks: [], res: null, done: false }
};
const packV = v => isCx(v) ? { re: v.re, im: v.im, cx: 1 } : (isNum(v) ? v : 0);
const unpackV = v => (v && v.cx) ? math.complex(v.re, v.im) : (isNum(v) ? v : 0);
let saveT = 0;
function save() {
  clearTimeout(saveT);
  saveT = setTimeout(() => Repo.set('state', {
    set: S.set, vars: Object.fromEntries(VARS.map(k => [k, packV(S.vars[k])])), ans: packV(S.ans), preAns: packV(S.preAns),
    mats: S.mats, vcts: S.vcts, matAns: S.matAns, vctAns: S.vctAns, st: S.st, eq: S.eq,
    tb: { a: S.tb.a, b: S.tb.b, s: S.tb.s, f: S.tb.f, g: S.tb.g }, app: S.app, base: S.base.b
  }), 250);
}
async function load() {
  const d = await Repo.get('state'); if (!d) return;
  Object.assign(S.set, d.set || {});
  if (d.vars) for (const k of VARS) S.vars[k] = unpackV(d.vars[k]);
  S.ans = unpackV(d.ans); S.preAns = unpackV(d.preAns);
  S.mats = d.mats || {}; S.vcts = d.vcts || {}; S.matAns = d.matAns || null; S.vctAns = d.vctAns || null;
  if (d.st) S.st = d.st; if (d.eq) S.eq = d.eq; if (d.tb) Object.assign(S.tb, d.tb);
  if (d.base) S.base.b = d.base;
  if (d.app) S.app = d.app;
}

/* ================= Ángulos ================= */
const toRad = x => S.set.angle === 'D' ? x * Math.PI / 180 : S.set.angle === 'G' ? x * Math.PI / 200 : x;
const fromRad = x => S.set.angle === 'D' ? x * 180 / Math.PI : S.set.angle === 'G' ? x * 200 / Math.PI : x;

/* ================= Numérico ================= */
class Pair { constructor(l, v) { this.l = l; this.v = v; } }
function lgamma(z) {
  const c = [0.99999999999980993, 676.5203681218851, -1259.1392167224028, 771.32342877765313, -176.61502916214059,
    12.507343278686905, -0.13857109526572012, 9.9843695780195716e-6, 1.5056327351493116e-7];
  if (z < 0.5) return Math.log(Math.PI / Math.abs(Math.sin(Math.PI * z))) - lgamma(1 - z);
  z -= 1; let x = c[0]; for (let i = 1; i < 9; i++) x += c[i] / (z + i);
  const t = z + 7.5; return 0.5 * Math.log(2 * Math.PI) + (z + 0.5) * Math.log(t) - t + Math.log(x);

const CUR = '<i class="cur"></i>';

  let h = '';

  return h;
}

  const r = si => rSlot(it.s[si], path.concat([[i, si]]), cur);

    case 'pow': return `<span class="sup">${r(0)}</span>`;

    case 'abs': return `<span class="abs">${r(0)}</span>`;
    case 'int': return `<span class="bigop"><span class="lim">${r(2)}</span><span class="sym">∫</span><span class="lim">${r(1)}</span></span>${r(0)}<span class="dx">dx</span>`;
    case 'der': return `<span class="frac"><span>d</span><span>d<i>x</i></span></span><span class="tk">(</span>${r(0)}<span class="tk">)</span><span class="sub"><i>x</i>=${r(1)}</span>`;

const rootH = z => z[1] === 0 ? fmtNum(z[0]) : cxStr(math.complex(z[0], z[1]), false);
function eqnSolve(id) {
  const v = S.form.fields.map(f => f.val ?? 0), n = +id[1], t = ETYPES.find(e => e[0] === id);
  if (id[0] === 's') {
    const M = Array.from({ length: n }, (_, r) => v.slice(r * (n + 1), r * (n + 1) + n + 1));
    const R = rrefArr(M, true), zero = r => r.slice(0, n).every(x => Math.abs(x) < 1e-10);
    if (R.some(r => zero(r) && Math.abs(r[n]) > 1e-10)) { showView({ title: 'Solución', info: t[1], rows: [['Sin solución', '']] }); return; }
    if (R.some(zero)) { showView({ title: 'Solución', info: t[1], rows: [['Infinitas soluciones', '']] }); return; }
    showView({ title: 'Solución', info: t[1], rows: R.map((r, i) => [`<i>${'xyzt'[i]}</i> =`, fmtNum(Math.abs(r[n]) < 1e-14 ? 0 : r[n])]) });
    return;
  }
  if (v[0] === 0) fail('El coeficiente a no puede ser 0');
  const roots = polyRoots(v), rows = roots.map((z, i) => [`<i>x</i><sub>${i + 1}</sub> =`, rootH(z)]);
  if (n === 2) {
    const xv = -v[1] / (2 * v[0]), yv = v[2] - v[1] * v[1] / (4 * v[0]), w = v[0] > 0 ? 'mínimo' : 'máximo';
    rows.push([`<i>x</i> del ${w}`, fmtNum(xv)], [`<i>y</i> del ${w}`, fmtNum(yv)]);
  }
  showView({ title: 'Soluciones', info: POLYH[n] + '=0', rows });
}
const ISIGNS = [['>', '&gt;'], ['<', '&lt;'], ['≥', '≥'], ['≤', '≤']];
function ineqEnter() {
  pushMenu({ title: 'Inecuaciones', items: [2, 3, 4].map(d => ({ label: 'Grado ' + d, val: () => POLYH[d], sub: () => ({ title: 'Tipo de desigualdad', items: ISIGNS.map(([s, h]) => ({ label: `${POLYH[d]} ${h} 0`, act: () => ineqForm(d, s) })) }) })) });
}
function ineqForm(d, s) {
  const h = ISIGNS.find(x => x[0] === s)[1];
  coefForm('i' + d, 'Inecuación de grado ' + d, `${POLYH[d]} ${h} 0`, 1, d + 1, 'abcde'.slice(0, d + 1).split(''), () => ineqSolve(d, s), ineqEnter);
}
function ineqSolve(d, s) {
  const c = S.form.fields.map(f => f.val ?? 0); if (c[0] === 0) fail('El coeficiente a no puede ser 0');
  const f = x => c.reduce((r, k) => r * x + k, 0);
  const rs = polyRoots(c).filter(z => z[1] === 0).map(z => z[0]).sort((a, b) => a - b).filter((r, i, A) => i === 0 || Math.abs(r - A[i - 1]) > 1e-9 * Math.max(1, Math.abs(r)));
  const test = y => s === '>' ? y > 0 : s === '<' ? y < 0 : s === '≥' ? y >= 0 : y <= 0;
  const incl = s === '≥' || s === '≤';
  const els = [];
  const k = rs.length;
  const mid = i => k === 0 ? 0 : i === 0 ? rs[0] - 1 : i === k ? rs[k - 1] + 1 : (rs[i - 1] + rs[i]) / 2;
  for (let i = 0; i <= k; i++) { els.push({ seg: i, ok: test(f(mid(i))) }); if (i < k) els.push({ root: i, ok: incl }); }
  const out = []; let i = 0;
  while (i < els.length) {
    if (!els[i].ok) { i++; continue; }
    let j = i; while (j + 1 < els.length && els[j + 1].ok) j++;
    const A = els[i], B = els[j], X = '<i>x</i>', lt = incl ? '≤' : '&lt;', gt = incl ? '≥' : '&gt;';
    if (A === B && 'root' in A) out.push(`${X} = ${fmtNum(rs[A.root])}`);
    else {
      const lo = 'root' in A ? [rs[A.root], true] : A.seg === 0 ? null : [rs[A.seg - 1], false];
      const hi = 'root' in B ? [rs[B.root], true] : B.seg === k ? null : [rs[B.seg], false];
      if (!lo && !hi) out.push('Todos los números reales');
      else if (!lo) out.push(`${X} ${hi[1] ? '≤' : '&lt;'} ${fmtNum(hi[0])}`);
      else if (!hi) out.push(`${X} ${lo[1] ? '≥' : '&gt;'} ${fmtNum(lo[0])}`);
      else out.push(`${fmtNum(lo[0])} ${lo[1] ? '≤' : '&lt;'} ${X} ${hi[1] ? '≤' : '&lt;'} ${fmtNum(hi[0])}`);
      void lt; void gt;
    }
    i = j + 1;
  }
  if (!out.length) out.push('Sin solución');
  showView({ title: 'Solución', info: S.form.info, rows: out.map(o => [o, '']) });
}

/* ================= Tabla ================= */
function tableForm() {
  mkForm({
    title: 'Tabla de valores', fields: [{ label: 'f(<i>x</i>) =', expr: true, toks: S.tb.f.slice() }, { label: 'g(<i>x</i>) =', expr: true, toks: S.tb.g.slice() }, { label: 'Inicio', val: S.tb.a }, { label: 'Fin', val: S.tb.b }, { label: 'Paso', val: S.tb.s }],
    hint: 'Escribe f(x) con la tecla x. g(x) es opcional. OK genera.',
    onCommit: () => { const F = S.form.fields; S.tb.f = F[0].toks.slice(); S.tb.g = F[1].toks.slice(); S.tb.a = F[2].val; S.tb.b = F[3].val; S.tb.s = F[4].val; save(); },
    onOk: tableGen, onLast: tableGen, onBack: openHome
  });
}
function tableGen() {
  const F = S.form.fields;
  if (!F[0].toks.length) fail('Escribe f(x) primero');
  const a = F[2].val, b = F[3].val, st = F[4].val;
  if (a == null || b == null || !st) fail('arg');
  const n = Math.floor((b - a) / st + 1e-9) + 1; if (n < 1) fail('arg'); if (n > 45) fail('Máximo 45 filas: ajusta el paso');
  const comp = t => { try { return math.compile(emitC(t)); } catch (e) { throw mapErr(e); } };
  const cf = comp(F[0].toks), cg = F[1].toks.length ? comp(F[1].toks) : null, sc = scope();
  const ev = c => { try { const v = normalize(c.evaluate(sc), false); return isNum(v) ? shortDec(v) : 'Error'; } catch (e) { return 'Error'; } };
  const rows = [];
  for (let i = 0; i < n; i++) { const x = +(a + i * st).toPrecision(12); sc.x = x; const r = [shortDec(x), ev(cf)]; if (cg) r.push(ev(cg)); rows.push(r); }
  showView({ title: 'Tabla', info: `${n} filas`, table: { head: ['<i>x</i>', 'f(<i>x</i>)', ...(cg ? ['g(<i>x</i>)'] : [])], rows }, hint: '▲▼ recorre la tabla. AC vuelve a la definición.' });
}

/* ================= Proporción ================= */
function ratioEnter() { pushMenu({ title: 'Proporción', items: [{ label: 'A : B = <i>X</i> : D', act: () => ratioForm(0) }, { label: 'A : B = C : <i>X</i>', act: () => ratioForm(1) }] }); }
function ratioForm(t) {
  mkForm({ title: t ? 'A : B = C : X' : 'A : B = X : D', fields: [{ label: 'A', val: 1 }, { label: 'B', val: 1 }, { label: t ? 'C' : 'D', val: 1 }], hint: 'EXE pasa al siguiente dato. OK calcula.',
    onOk: () => ratioSolve(t), onLast: () => ratioSolve(t), onBack: ratioEnter });
}
function ratioSolve(t) {
  const [A, B, C] = S.form.fields.map(f => { if (f.val == null) fail('data'); return f.val; });
  if (t ? A === 0 : B === 0) fail('math');
  const X = t ? B * C / A : A * C / B; S.preAns = S.ans; S.ans = X; save();
  showView({ title: 'Resultado', info: S.form.title, rows: [['<i>X</i> =', fmtNum(X)]], hint: 'El resultado queda en Ans. AC vuelve a los datos.' });
}

/* ================= Registro de apps ================= */
const APPS = {
  calc: { name: 'Calcular', kind: 'edit', tools: calcTools },
  cplx: { name: 'Complejos', kind: 'edit', tools: cplxTools, enter: () => toast('En Complejos la tecla x escribe i') },
  base: { name: 'Base-N', kind: 'base', tools: baseTools },
  mat: { name: 'Matrices', kind: 'edit', tools: matTools, enter: () => { if (!Object.keys(S.mats).length) pushMenu(defMenu('mat')); } },
  vct: { name: 'Vectores', kind: 'edit', tools: vctTools, enter: () => { if (!Object.keys(S.vcts).length) pushMenu(defMenu('vct')); } },
  stat: { name: 'Estadística', kind: 'form', enter: statEnter, tools: statTools },
  dist: { name: 'Distribución', kind: 'form', enter: distEnter },
  eqn: { name: 'Ecuaciones', kind: 'form', enter: eqnEnter },

/* ================= Teclado ================= */
const BOX = '□';
const KFN = [
  { id: 'frac', l: `<span class="frac"><span>${BOX}</span><span>${BOX}</span></span>`, sh: ['mixed', 'mixta'], aria: 'Fracción' },
  { id: 'sqrt', l: sqrtH(BOX), sh: ['cbrt', '∛'], aria: 'Raíz cuadrada' },
  { id: 'sq', l: '<i>x</i><sup>2</sup>', sh: ['cube', '<i>x</i><sup>3</sup>'], aria: 'Cuadrado' },
  { id: 'pow', l: '<i>x</i><sup>■</sup>', sh: ['root', 'ⁿ√'], aria: 'Potencia' },
  { id: 'log', l: 'log', sh: ['p10', '10ˣ'], aria: 'Logaritmo decimal' },

  { id: 'neg', l: '(−)', sh: ['angle', '∠'], aria: 'Negativo' },
  { id: 'x', l: '<i>x</i>', sh: ['i', '<i>i</i>'], al: ['y', '<i>y</i>'], aria: 'Variable x' },
  { id: 'inv', l: '<i>x</i><sup>−1</sup>', sh: ['fact', '<i>x</i>!'], aria: 'Inverso' },

  { id: 'cos', l: 'cos', sh: ['acos', 'cos<sup>−1</sup>'] },
  { id: 'tan', l: 'tan', sh: ['atan', 'tan<sup>−1</sup>'] },
  { id: 'int', l: `<span class="ms">∫${BOX}</span>`, sh: ['der', 'd/d<i>x</i>'], aria: 'Integral' },
  { id: 'sum', l: '<span class="ms">Σ</span>', sh: ['prod', '∏'], aria: 'Sumatoria' },
  { id: 'lp', l: '(', sh: ['abs', '|<i>x</i>|'] },
  { id: 'rp', l: ')', sh: ['comma', ','] },

  { id: 'logb', l: `log<sub>${BOX}</sub>`, sh: ['intf', 'Int'], aria: 'Logaritmo en base' }
];
const KNUM = [
  { id: 'd7', l: '7', al: ['vA', 'A'] }, { id: 'd8', l: '8', al: ['vB', 'B'] }, { id: 'd9', l: '9', al: ['vC', 'C'] }, { id: 'del', l: 'DEL', cls: 'wd del', aria: 'Borrar' }, { id: 'ac', l: 'AC', cls: 'wd ac', aria: 'Borrar todo' },
  { id: 'd4', l: '4', al: ['vD', 'D'] }, { id: 'd5', l: '5', al: ['vE', 'E'] }, { id: 'd6', l: '6', al: ['vF', 'F'] }, { id: 'mul', l: '×', sh: ['npr', '<i>n</i>P<i>r</i>'] }, { id: 'div', l: '÷', sh: ['ncr', '<i>n</i>C<i>r</i>'] },
  { id: 'd1', l: '1', sh: ['gcd', 'MCD'], al: ['z', '<i>z</i>'] }, { id: 'd2', l: '2', sh: ['lcm', 'MCM'], al: ['vM', 'M'] }, { id: 'd3', l: '3', sh: ['ranint', 'RanInt'] }, { id: 'add', l: '+', sh: ['pol', 'Pol'] }, { id: 'sub', l: '−', sh: ['rec', 'Rec'] },
  { id: 'd0', l: '0', sh: ['rnd', 'Rnd'] }, { id: 'dot', l: '.', sh: ['ran', 'Ran#'] }, { id: 'E10', l: '<span style="font-size:15px">×10<sup><i>x</i></sup></span>', sh: ['pi', 'π'], al: ['e', '<i>e</i>'], aria: 'Por diez a la' },
  { id: 'ans', l: 'Ans', cls: 'wd', sh: ['preans', 'PreAns'] }, { id: 'exe', l: 'EXE', cls: 'wd', sh: ['approx', '≈'], aria: 'Ejecutar' }
];
const KCTRL = [
  { id: 'shift', l: 'Shift', cls: 'shift', c: 1, r: 1 }, { id: 'alpha', l: 'Alpha', cls: 'alpha', c: 2, r: 1 },
  { id: 'var', l: 'Var', c: 1, r: 2 }, { id: 'catalog', l: 'Catálogo', c: 2, r: 2 },
  { id: 'home', l: 'Inicio', sh: ['settings', 'Ajustes'], c: 4, r: 1 }, { id: 'back', l: 'Atrás', c: 5, r: 1 },
  { id: 'tools', l: 'Opciones', c: 4, r: 2 }, { id: 'format', l: 'Formato', c: 5, r: 2 }

const KDEF = {}; [...KFN, ...KNUM, ...KCTRL].forEach(k => KDEF[k.id] = k);
const strip = h => String(h).replace(/<[^>]+>/g, '');
function buildKeys() {
  const kh = k => `<div class="k"><div class="lg"><span class="s">${k.sh ? k.sh[1] : ''}</span><span class="a">${k.al ? k.al[1] : ''}</span></div><button class="key ${k.cls || ''}" data-k="${k.id}" aria-label="${k.aria || strip(k.l)}">${k.l}</button></div>`;

    `<div class="dpad"><button class="up" data-k="up" aria-label="Arriba">▲</button><button class="lf" data-k="left" aria-label="Izquierda">◀</button><button class="ok" data-k="ok">OK</button><button class="rt" data-k="right" aria-label="Derecha">▶</button><button class="dn" data-k="down" aria-label="Abajo">▼</button></div>`;

function relabel() {
  document.body.classList.toggle('base-mode', S.app === 'base');
  for (const b of document.querySelectorAll('.key[data-k]')) {
    const id = b.dataset.k, d = KDEF[id]; if (!d) continue;
    let l = d.l;

/* ================= Despacho ================= */
function haptic() { if (S.set.haptic && navigator.vibrate) { try { navigator.vibrate(8); } catch (e) { } } }
let toastT;
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 1900); }
function dispatch(a) {
  if (a === 'home') { openHome(); return; }
  if (a === 'settings') { pushMenu(settingsMenu()); return; }
  if (S.err) {
    S.err = null;
    if (['left', 'right', 'back', 'del', 'ok', 'exe', 'up', 'down'].includes(a)) return;
    if (a === 'ac') { if (!S.form && !S.view && APPS[S.app].kind === 'edit') { S.expr = []; S.cur = { path: [], i: 0 }; S.done = false; } return; }
  }
  if (S.stack.length) return menuKey(a);
  if (S.view) return viewKey(a);
  if (S.form) return formKey(a);
  const k = APPS[S.app].kind;
  if (k === 'base') return baseKey(a);
  if (k === 'edit') return editKey(a);
  ensureScreen();
}
function run(a) {
  try { dispatch(a); } catch (e) { const ce = mapErr(e); S.err = ce.message; if (!(e && e.calc) && window.console) console.warn(e); }
  render();
}
function press(id) {
  haptic();
  if (id === 'shift') { S.shift = !S.shift; S.alpha = false; render(); return; }
  if (id === 'alpha') { S.alpha = !S.alpha; S.shift = false; render(); return; }
  const d = KDEF[id]; let a = id;
  const plain = !S.stack.length && !S.form && !S.view;
  if (S.shift && d && d.sh) a = d.sh[0];
  else if (S.alpha && d && d.al) a = d.al[0];
  else if (S.app === 'base' && plain && BASEMAP[id]) a = BASEMAP[id][1];
  else if (S.app === 'cplx' && id === 'x' && plain) a = 'i';
  S.shift = S.alpha = false;
  run(a);
}

/* ================= Render ================= */
function vStatus() {
  const p = [];
  if (S.shift) p.push('<span class="on">S</span>');
  if (S.alpha) p.push('<span class="on">A</span>');
  p.push(`<span>${S.app === 'base' ? BASES[S.base.b] : S.set.angle}</span>`);
  if (S.set.fmt === 'fix') p.push(`<span>Fix${S.set.fix}</span>`); else if (S.set.fmt === 'sci') p.push(`<span>Sci${S.set.sci}</span>`); else if (S.set.fmt === 'norm2') p.push('<span>Norm2</span>');
  if (S.set.res === 'dec') p.push('<span>Dec</span>');
  if (S.app === 'cplx') p.push(`<span>${S.set.cplx === 'polar' ? 'r∠θ' : 'a+bi'}</span>`);
  if (isNum(S.vars.M) && S.vars.M !== 0) p.push('<span>M</span>');
  if (APPS[S.app].kind === 'edit' && S.hist.length && S.hi > 0) p.push('<span>▲</span>');
  p.push(`<span class="app">${APPS[S.app].name}</span>`);
  return p.join('');
}
function vEdit() {
  let h = `<div class="input m"><span class="wrap">${rSlot(S.expr, [], S.done ? null : S.cur, true)}</span></div>`;
  if (S.done && S.res) h += `<div class="result m">${S.res.html}</div>`;
  return h;
}
function render() {
  $('#status').innerHTML = vStatus();
  let h;
  if (S.stack.length) h = vMenu(S.stack[S.stack.length - 1]);
  else if (S.view) h = vView(S.view);
  else if (S.form) h = vForm(S.form);
  else if (APPS[S.app].kind === 'base') h = vBase();
  else if (APPS[S.app].kind === 'edit') h = vEdit();
  else h = '';
  if (S.err) h += `<div class="err" role="alert"><b>${S.err}</b><span>◀ o ▶ para corregir. AC para borrar.</span></div>`;
  const v = $('#view'); v.innerHTML = h;
  document.body.classList.toggle('sh', S.shift); document.body.classList.toggle('al', S.alpha);
  const c = v.querySelector('.input .cur') || v.querySelector('.sel');
  if (c) c.scrollIntoView({ block: 'nearest', inline: 'nearest' });
}

/* ================= Eventos ================= */
const REPEAT = new Set(['del', 'left', 'right', 'up', 'down']);
let rep = null;
const clearRep = () => { clearTimeout(rep); clearInterval(rep); rep = null; };
function bindEvents() {
  document.addEventListener('pointerdown', e => {
    const b = e.target.closest('[data-k]'); if (!b) return;
    e.preventDefault(); b.classList.add('down');
    const id = b.dataset.k; press(id);
    clearRep(); if (REPEAT.has(id)) rep = setTimeout(() => { rep = setInterval(() => press(id), 80); }, 420);
  });
  const up = () => { document.querySelectorAll('.down').forEach(x => x.classList.remove('down')); clearRep(); };
  ['pointerup', 'pointercancel'].forEach(t => window.addEventListener(t, up));
  window.addEventListener('blur', up);
  document.addEventListener('click', e => { const b = e.target.closest('[data-k]'); if (b && e.detail === 0) press(b.dataset.k); });
  document.addEventListener('contextmenu', e => { if (e.target.closest('.calc')) e.preventDefault(); });
  $('#view').addEventListener('click', e => {
    const t = e.target.closest('[data-alt],[data-mi],[data-fi],[data-vi]'); if (!t) return;
    haptic();
    try {
      if (t.dataset.alt != null) { const m = S.stack[S.stack.length - 1]; m.sel = +t.dataset.alt; m.items[m.sel].alt(); }
      else if (t.dataset.mi != null) { const m = S.stack[S.stack.length - 1]; m.sel = +t.dataset.mi; runItem(m.items[m.sel]); }
      else if (t.dataset.fi != null) { commitField(S.form); S.form.sel = +t.dataset.fi; }
      else if (t.dataset.vi != null) S.view.sel = +t.dataset.vi;
    } catch (err) { S.err = mapErr(err).message; }
    render();
  });
  const KB = { '.': 'dot', ',': 'comma', '+': 'add', '-': 'sub', '*': 'mul', '/': 'div', '^': 'pow', '(': 'lp', ')': 'rp', Enter: 'exe', '=': 'exe', Backspace: 'del', Escape: 'ac', Delete: 'ac',
    ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', '!': 'fact', '%': 'pct', x: 'x', s: 'sin', c: 'cos', t: 'tan', l: 'ln', r: 'sqrt', p: 'pi', e: 'e', h: 'home', a: 'ans' };
  for (let d = 0; d < 10; d++) KB[d] = 'd' + d;
  document.addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const a = KB[e.key]; if (!a) return;
    e.preventDefault(); run(a);
  });
}

/* ================= Arranque ================= */
(async function init() {
  buildKeys(); bindEvents();
  try { await load(); } catch (e) { }
  if (!APPS[S.app]) S.app = 'calc';
  applySettings(); relabel();
  if (APPS[S.app].kind === 'form') APPS[S.app].enter();
  render();
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    navigator.serviceWorker.register('sw.js').catch(() => { });
  }
})();
